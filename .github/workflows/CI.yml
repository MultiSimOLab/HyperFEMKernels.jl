name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
  hyperfem:
    name: HyperFEM weak forms - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
    steps:
      - uses: actions/checkout@v4
        with:
          path: HyperFEMKernels.jl
      - uses: actions/checkout@v4
        with:
          repository: MultiSimOLab/HyperFEM
          ref: kernel-backend          # branch of the integration with HyperFEMKernels (simulation tests with both backends)
          path: HyperFEM.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Set up environment
        run: julia HyperFEMKernels.jl/test/hyperfem/setup.jl
      - name: Run HyperFEM weak-form tests
        run: julia -t 2 --project=HyperFEMKernels.jl/test/hyperfem HyperFEMKernels.jl/test/hyperfem/runtests.jl
