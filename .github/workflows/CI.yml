name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  # Pull requests that only touch documentation (Markdown, docs/, LICENSE) skip the Julia tests.
  # Pushes, tags and manual runs always run them.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
  # The engine tests run in two groups (HFK_TEST_GROUP, see test/runtests.jl) so that each job stays
  # well below the time limit: `test` runs everything but the H(div) tests (the job names are the
  # required checks of main), `test-hdiv` runs the H(div) tests.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
          HFK_TEST_GROUP: core
  test-hdiv:
    name: H(div) tests - Julia ${{ matrix.version }} - ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
          HFK_TEST_GROUP: hdiv
  hyperfem:
    name: HyperFEM weak forms - Julia ${{ matrix.version }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
    steps:
      - uses: actions/checkout@v4
        with:
          path: HyperFEMKernels.jl
      - uses: actions/checkout@v4
        with:
          repository: MultiSimOLab/HyperFEM
          ref: main                    # HyperFEM with the kernel backend (≥ 0.0.7): simulation tests with both backends
          path: HyperFEM.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Set up environment
        run: julia HyperFEMKernels.jl/test/hyperfem/setup.jl
      - name: Run HyperFEM weak-form tests
        run: julia -t 2 --project=HyperFEMKernels.jl/test/hyperfem HyperFEMKernels.jl/test/hyperfem/runtests.jl
  # Single required check for the protection of main: passes when the tests passed, or when they
  # were skipped because the pull request only changes documentation.
  ci:
    name: CI
    if: always()
    needs: [changes, test, test-hdiv, hyperfem]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "code changed: ${{ needs.changes.outputs.code }}"
          echo "test: ${{ needs.test.result }}, test-hdiv: ${{ needs.test-hdiv.result }}, hyperfem: ${{ needs.hyperfem.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          if [ "${{ needs.changes.outputs.code }}" = true ]; then
            [ "${{ needs.test.result }}" = success ] && [ "${{ needs.test-hdiv.result }}" = success ] && [ "${{ needs.hyperfem.result }}" = success ] || exit 1
          else
            [ "${{ needs.test.result }}" = skipped ] && [ "${{ needs.test-hdiv.result }}" = skipped ] && [ "${{ needs.hyperfem.result }}" = skipped ] || exit 1
          fi
