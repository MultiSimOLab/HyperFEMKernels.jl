name: CompatHelper
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'import Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        # Opens a pull request when a dependency releases a version outside [compat].
        # Gridap is pinned (=0.19.9) on purpose; its PRs can be closed until HyperFEM upgrades.
        run: julia -e 'import CompatHelper; CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
