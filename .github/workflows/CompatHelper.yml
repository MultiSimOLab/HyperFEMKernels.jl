name: CompatHelper
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'import Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        # Opens a pull request when a dependency releases a version outside [compat].
        # Gridap is restricted to one minor series (0.20) on purpose: the engine reads Gridap's internals,
        # so a PR for a new Gridap series needs the full test suite before it is merged.
        run: julia -e 'import CompatHelper; CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
